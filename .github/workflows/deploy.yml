name: Deploy

# Runs after the CI workflow completes successfully on main, and deploys the
# exact commit CI validated. Until the repo secrets are configured the job is
# a no-op with a pointer to the README — see "Deploying to Vercel".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping deploy. See README → Deploying to Vercel."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the validated commit
        uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: Pull Vercel project settings + environment
        if: steps.check.outputs.ok == 'true'
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (SPA + API function)
        if: steps.check.outputs.ok == 'true'
        run: npx vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to production
        id: deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::Could not read the deployment URL from the vercel output"
            tail -20 deploy.log
            exit 1
          fi
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the live deployment
        if: steps.check.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          base="$DEPLOY_URL"
          echo "Verifying $base"

          # API: poll until healthy (function cold start / edge propagation).
          ok=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "  health attempt $i: HTTP $code — retrying…"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::/api/health never returned 200 at $base"
            exit 1
          fi
          health=$(curl -s "$base/api/health")
          echo "$health" | grep -q '"ok":true' || { echo "::error::Unexpected health body: $health"; exit 1; }
          echo "✅ API health OK"

          # SPA: the app shell is served and its built JS asset loads.
          html=$(curl -s "$base/")
          echo "$html" | grep -q '<div id="root">' || { echo '::error::SPA root missing — index.html not served'; exit 1; }
          echo "$html" | grep -qi '<title>Field Ledger' || { echo '::error::Unexpected page title'; exit 1; }
          asset=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1 || true)
          if [ -n "$asset" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$asset")
            [ "$code" = "200" ] || { echo "::error::Asset $asset returned HTTP $code"; exit 1; }
          fi
          echo "✅ SPA shell + JS asset load"
          echo "Deployment verified: $base"
